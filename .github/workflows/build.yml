name: Build

on:
  push:
    branches:
      - '*.x'
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch: ~

jobs:
  tests:
    name: Tests
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # We need to cover combinations of three separate versions (PHP, PHPUnit, Symfony).
        #
        # But in practice, the Symfony dependency is so small (just the symfony/container that Behat passes to our
        # Extension) that it doesn't merit standalone runs for each Symfony version. We just need to make sure each
        # version has been used somewhere.
        #
        # Similarly, our own code is so thin (and covered by PHPStan / Rector) that we don't need to cover every
        # possible PHP version with every possible PHPUnit version.
        #
        # Therefore, instead of using a base matrix, we specify all the builds explicitly. This makes it easier to be
        # sure we're covering everything we need to, without a ridiculous number of combinations.
        #
        # Being explicit about all options also makes it easier to see which job is which in the UI.
        include:

          # One job to test the lowest of all possible supported combinations with --prefer-lowest
          - php: '8.2'
            phpunit-version: '8'
            symfony-version: '5.4.*'
            composer-flags: '--prefer-lowest'
            os: 'ubuntu-latest'

          # Then from the oldest to newest PHPUnit version, picking up PHP and Symfony versions at the same time
          - php: '8.2'
            phpunit-version: '8'
            symfony-version: '5.4.*'
            composer-flags: ''
            os: 'ubuntu-latest'

          - php: '8.3'
            phpunit-version: '9'
            symfony-version: '6.4.*'
            composer-flags: ''
            os: 'ubuntu-latest'

          - php: '8.4'
            phpunit-version: '10'
            symfony-version: '7.4.*'
            composer-flags: ''
            os: 'ubuntu-latest'

          - php: '8.4'
            phpunit-version: '11'
            symfony-version: '8.*'
            composer-flags: ''
            os: 'ubuntu-latest'

          - php: '8.5'
            phpunit-version: '12'
            symfony-version: '8.*'
            composer-flags: ''
            os: 'ubuntu-latest'

          # On the highest supported PHPUnit / PHP version, leave symfony unspecified
          # This ensures that the build passes with only our own composer dependencies, not symfony/flex
          - php: '8.5'
            phpunit-version: '13'
            symfony-version: ''
            composer-flags: ''
            os: 'ubuntu-latest'

          # Test the highest supported versions on windows & macos
          # These do merit second jobs, in case the output varies between platforms
          - php: '8.5'
            phpunit-version: '13'
            symfony-version: '8.*'
            os: 'windows-latest'

          - php: '8.5'
            phpunit-version: '13'
            symfony-version: '8.*'
            os: 'macos-latest'

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          ini-file: "development"
          ini-values: "phar.readonly=0,zend.exception_ignore_args=Off"
          coverage: none

      - name: Install symfony/flex
        if: matrix.symfony-version != ''
        run: |
          composer config --global --no-plugins allow-plugins.symfony/flex true &&
          composer global require symfony/flex

      - name: Install composer dependencies
        env:
          SYMFONY_REQUIRE: ${{ matrix.symfony-version }}
        run: composer update ${{ format('--with=phpunit/phpunit:^{0}', matrix.phpunit-version) }} ${{ matrix.composer-flags }}

      - name: Run tests (Behat)
        run: vendor/bin/behat -fpretty --strict --profile=${{ format('phpunit-{0}', matrix.phpunit-version) }}

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.2, 8.5]
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          ini-values: "zend.exception_ignore_args=Off"
          coverage: none

      - name: Install dependencies
        run: composer update

      - name: Run PHPStan
        run: ./vendor/bin/phpstan

  coding-standard:
    name: Coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          ini-values: "zend.exception_ignore_args=Off"
          coverage: none

      - name: Install dependencies
        run: composer update

      - name: Run PHP CS Fixer
        run: ./vendor/bin/php-cs-fixer fix --dry-run --verbose --diff

  rector:
    name: Rector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          ini-values: "zend.exception_ignore_args=Off"
          coverage: none

      - name: Install dependencies
        run: composer update

      - name: Run Rector
        run: ./vendor/bin/rector --dry-run

