name: Build

on:
  push:
    branches:
      - '*.x'
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch: ~

jobs:
  tests:
    name: Tests
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        php: [8.2, 8.3, 8.4, 8.5]
        os: [ubuntu-latest]
        composer-mode: [update]
        symfony-version: ['']
        phpunit-version: ['']
        include:
          # Older PHPUnit versions - run on the lowest (supported) PHP that each PHPUnit version supports
          # We do not expect to see any variation in our own behaviour across different PHP versions.
          - php: 8.2
            os: ubuntu-latest
            composer-mode: [update]
            symfony-version: ''
            phpunit-version: 8

          - php: 8.2
            os: ubuntu-latest
            composer-mode: [ update ]
            symfony-version: ''
            phpunit-version: 9

          # MacOS on latest of all dependencies only
          - php: 8.5
            os: macos-latest
            composer-mode: update
            symfony-version: ''
            phpunit-version: ''

          # Windows on latest of all dependencies only
          - php: 8.5
            os: windows-latest
            composer-mode: update
            symfony-version: ''
            phpunit-version: ''

          # Symfony LTS jobs:
          # - These are only required to ensure that our use of ContainerBuilder is compatible with all Behat-supported
          #   Symfony versions. There's no interaction between the PHPUnit version and the symfony version
          #   that could affect our behaviour at runtime.
          #   Therefore, we don't need variants of Symfony/PHPUnit, we can just run with whatever is installable

          - php: 8.2
            os: ubuntu-latest
            composer-mode: update
            symfony-version: '5.4.*'
            phpunit-version: ''

          - php: 8.2
            os: ubuntu-latest
            composer-mode: update
            symfony-version: '6.4.*'
            phpunit-version: ''

          # Symfony 7.4 LTS already builds on our normal PHP 8.2 and PHP 8.3 jobs

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          ini-file: "development"
          ini-values: "phar.readonly=0,zend.exception_ignore_args=Off"
          coverage: none

      - name: Install symfony/flex
        if: matrix.symfony-version != ''
        run: |
          composer config --global --no-plugins allow-plugins.symfony/flex true &&
          composer global require symfony/flex

      - name: Install composer dependencies
        env:
          SYMFONY_REQUIRE: ${{ matrix.symfony-version }}
          COMPOSER_PHPUNIT: |-
            ${{ case(
              matrix.phpunit-version == '',
              '',
              format('--with=''phpunit/phpunit:^{0}''', matrix.phpunit-version)
            ) }}
          COMPOSER_LOWEST: ${{ case(matrix.composer-mode == 'lowest', '--prefer-lowest', '') }}
        run: composer update $COMPOSER_PHPUNIT $COMPOSER_LOWEST

      - name: Run tests (Behat)
        env:
          PHPUNIT_PROFILE: |-
            ${{ case(
              matrix.phpunit-version == '',
              'phpunit-10',
              format('phpunit-', matrix.phpunit-version)
            ) }}
        run: vendor/bin/behat -fpretty --strict --profile=$PHPUNIT_PROFILE

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.2, 8.5]
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          ini-values: "zend.exception_ignore_args=Off"
          coverage: none

      - name: Install dependencies
        run: composer update

      - name: Run PHPStan
        run: ./vendor/bin/phpstan

  coding-standard:
    name: Coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          ini-values: "zend.exception_ignore_args=Off"
          coverage: none

      - name: Install dependencies
        run: composer update

      - name: Run PHP CS Fixer
        run: ./vendor/bin/php-cs-fixer fix --dry-run --verbose --diff

  rector:
    name: Rector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          ini-values: "zend.exception_ignore_args=Off"
          coverage: none

      - name: Install dependencies
        run: composer update

      - name: Run Rector
        run: ./vendor/bin/rector --dry-run

